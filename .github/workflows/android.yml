# Builds the Android app on every push: unit tests + a side-loadable release APK
# (R8-optimised, signed with a freshly generated debug keystore) as a downloadable artifact.
name: Android

on:
  push:
    branches: [main, master]
    paths-ignore: ["ios/**", "docs/**", "**.md"]
    tags: ["android-v*"]
  pull_request:
    paths-ignore: ["ios/**", "docs/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build release APK
        # The `sideload` signing config uses ~/.android/debug.keystore; the SDK tools create it
        # on first use, so make sure it exists on a fresh runner.
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | cut -d'"' -f2)
          cp app/build/outputs/apk/release/app-release.apk "NamazTimes-Hubli-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NamazTimes-Android-apk
          path: NamazTimes-Hubli-v*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/test-results/
