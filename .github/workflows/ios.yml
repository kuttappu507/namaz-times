# Builds the iPhone app on GitHub's free macOS runners.
#
#  • Every push / PR / manual run  → unit tests + an UNSIGNED .ipa (download from the run's
#    "Artifacts" box; sideload with AltStore / Sideloadly using a free Apple ID).
#  • Manual run with "signed" ticked, or a git tag "ios-v*"  → a SIGNED .ipa uploaded to
#    TestFlight (needs a paid Apple Developer account + the secrets listed below).
#
# Secrets for the signed path (Settings → Secrets and variables → Actions):
#   IOS_CERT_P12_BASE64      Apple Distribution certificate (.p12) → base64 -i cert.p12
#   IOS_CERT_PASSWORD        password of that .p12
#   IOS_PROFILE_BASE64       App Store provisioning profile (.mobileprovision) → base64
#   APPLE_TEAM_ID            10-character Team ID
#   ASC_KEY_ID               App Store Connect API key ID
#   ASC_ISSUER_ID            App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64        the AuthKey_XXXX.p8 file → base64
name: iOS

on:
  push:
    branches: [main, master]
    paths: ["ios/**", ".github/workflows/ios.yml"]
    tags: ["ios-v*"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign and upload to TestFlight (requires secrets)"
        type: boolean
        default: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: NamazTimes
  PROJECT: ios/NamazTimes.xcodeproj
  BUNDLE_ID: com.namazapp.hubli

jobs:
  # ───────────────────────────────────────────────────────────────────────────────────────────
  test:
    name: Unit tests (simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app && xcodebuild -version

      - name: Generate Xcode project (if not committed)
        run: |
          if [ ! -d "$PROJECT" ]; then
            brew install xcodegen
            (cd ios && xcodegen generate)
          fi

      - name: Run tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log | xcbeautify --renderer github-actions

      - name: Show log on failure
        if: failure()
        run: tail -n 120 build/test.log

  # ───────────────────────────────────────────────────────────────────────────────────────────
  unsigned-ipa:
    name: Unsigned IPA (sideload)
    runs-on: macos-15
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Generate Xcode project (if not committed)
        run: |
          if [ ! -d "$PROJECT" ]; then
            brew install xcodegen
            (cd ios && xcodegen generate)
          fi

      - name: Build for device (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Package .ipa
        run: |
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n1)
          test -n "$APP" || { echo "::error::No .app produced"; exit 1; }
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry "NamazTimes-iOS-v${VERSION}-unsigned.ipa" Payload)
          ls -la build/*.ipa
          echo "IPA_NAME=NamazTimes-iOS-v${VERSION}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamazTimes-iOS-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────────────────────
  testflight:
    name: Signed IPA → TestFlight
    if: startsWith(github.ref, 'refs/tags/ios-v') || inputs.signed == true
    runs-on: macos-15
    timeout-minutes: 40
    needs: test
    environment: testflight
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Generate Xcode project (if not committed)
        run: |
          if [ ! -d "$PROJECT" ]; then
            brew install xcodegen
            (cd ios && xcodegen generate)
          fi

      - name: Install certificate & provisioning profile
        env:
          P12_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          test -n "$P12_B64" || { echo "::error::IOS_CERT_P12_BASE64 secret is missing"; exit 1; }
          KEYCHAIN=$RUNNER_TEMP/ci.keychain-db
          KEYCHAIN_PW=$(uuidgen)
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $NAME ($UUID)"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          # Build number = run number so every upload is unique for TestFlight.
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NamazTimes.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -n 40

      - name: Export signed .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/NamazTimes.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export | tail -n 20
          ls -la build/export

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls build/export/*.ipa | head -n1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamazTimes-iOS-signed-ipa
          path: build/export/*.ipa
          retention-days: 30
