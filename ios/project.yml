# XcodeGen spec – run `xcodegen generate` in this folder to produce NamazTimes.xcodeproj.
# (brew install xcodegen). Alternatively follow the manual steps in README.md.
name: NamazTimes
options:
  bundleIdPrefix: com.namazapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.3.1"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  NamazTimes:
    type: application
    platform: iOS
    sources:
      # Everything under NamazTimes/ – Swift files become sources, csv/ttf/xcassets become
      # bundle resources automatically. Info.plist is referenced via INFOPLIST_FILE instead.
      - path: NamazTimes
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namazapp.hubli
        # Bundles the whole CSV/fonts/asset catalog and registers the fonts (UIAppFonts).
        INFOPLIST_FILE: NamazTimes/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: NamazTimes/NamazTimes.entitlements
        # DEVELOPMENT_TEAM: YOUR_TEAM_ID   # or pick your team in Xcode → Signing & Capabilities

  NamazTimesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NamazTimesTests
      - path: NamazTimes/Resources/namaz_timings.csv
        buildPhase: resources
    dependencies:
      - target: NamazTimes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.namazapp.hubli.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NamazTimes:
    build:
      targets:
        NamazTimes: all
        NamazTimesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NamazTimesTests
    archive:
      config: Release
